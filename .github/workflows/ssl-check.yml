name: SSL 憑證到期檢查

# 每星期日香港時間朝早 8:00（UTC 00:00）觸發一次已經足夠——
# SSL 憑證通常提前 30 日先開始續期，唔需要日日檢查。

on:
  schedule:
    - cron: '0 0 * * 0'   # UTC 時間，逢星期日；即係香港時間（UTC+8）星期日朝早 8:00
  workflow_dispatch:

jobs:
  ssl-check:
    runs-on: ubuntu-latest
    steps:
      - name: 觸發 SSL 憑證檢查
        env:
          SSL_CHECK_SECRET: ${{ secrets.SSL_CHECK_SECRET }}
        run: |
          curl -sf "https://aael.online/api/ssl-check?secret=${SSL_CHECK_SECRET}"
