name: 系統健康檢查（靜默式）

# 每 6 小時觸發一次，平時完全冇聲氣；一旦網站設定或伺服器出事，
# 先會推送警報去 Discord。

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小時一次（UTC 00:00 / 06:00 / 12:00 / 18:00）
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: 觸發健康檢查
        env:
          HEALTH_CHECK_SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
        run: |
          curl -sf "https://aael.online/api/health-check-notify?secret=${HEALTH_CHECK_SECRET}"
