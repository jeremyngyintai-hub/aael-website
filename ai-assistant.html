<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>AAEL AI Pro · 樓宇查詢即時解答</title>
<meta name="description" content="AAEL AI Pro，即時解答簡樸房認證、強制驗樓、屋宇署命令、僭建等香港樓宇查詢，並連結至相關知識庫文章。一般資訊參考，不構成專業意見。">
<link rel="canonical" href="https://aael.online/ai-assistant.html">
<link rel="icon" href="/favicon.png">
<style>
:root{
  /* light theme (default, matches homepage) */
  --bg:#F7F5F0;--bg-2:#FFFFFF;
  --panel:#FFFFFF;--panel2:#F0EDE8;
  --line:rgba(23,25,30,.12);
  --txt:#17191E;--dim:#5C606A;
  --acc:#92491A;--acc2:#B05E28;--acc-deep:#6E3512;
  --warn:#B23D22;--ok:#3F7A32;
  --btn-txt:#FFFFFF;--logo-filter:none;
  --disp:'Archivo',system-ui,'Noto Sans TC',sans-serif;--body:system-ui,'Noto Sans TC',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body.dark{
  --bg:#0A0C11;--bg-2:#0F121A;
  --panel:#12151C;--panel2:#171B24;
  --line:rgba(255,255,255,.10);
  --txt:#EDEDEA;--dim:#9AA0AC;
  --acc:#CE8F5A;--acc2:#E8B183;--acc-deep:#92491A;
  --warn:#E0765A;--ok:#7FB069;
  --btn-txt:#0A0C11;--logo-filter:brightness(1.55) saturate(.92);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--body);line-height:1.65;
display:flex;flex-direction:column;height:100dvh;transition:background .25s,color .25s}

/* ---- header：跟隨網站品牌 ---- */
header{border-bottom:1px solid var(--line);padding:12px 18px;display:flex;
flex-wrap:wrap;align-items:center;gap:12px;background:var(--panel);flex-shrink:0}
.back-link{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--dim);
font-size:.82rem;font-weight:600;padding:6px 10px 6px 4px;border-radius:8px;transition:color .2s}
.back-link:hover{color:var(--acc2)}
header a.home{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--txt)}
header .mark{width:26px;height:26px;flex-shrink:0}
header .mark svg{width:100%;height:100%;stroke:var(--acc);fill:none;stroke-width:1.4}
header h1{font-family:var(--disp);font-size:.92rem;font-weight:800;letter-spacing:.01em;white-space:nowrap}
header .tag{font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;
color:var(--acc);border:1px solid var(--acc);border-radius:100px;padding:2px 8px;white-space:nowrap}
.spacer{flex:1}
.quota-pill{font-family:var(--mono);font-size:.66rem;color:var(--dim);white-space:nowrap}
.quota-pill b{color:var(--acc2);font-weight:600}
.hbtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;
padding:6px 11px;font-size:.76rem;cursor:pointer;font-family:var(--body);text-decoration:none;white-space:nowrap}
.hbtn:hover{border-color:var(--acc);color:var(--acc2)}

/* ---- lang + theme switches (same pattern as homepage) ---- */
.switches{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:100px;overflow:hidden}
.lang button{background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:.68rem;
font-weight:600;padding:6px 10px;cursor:pointer;transition:all .2s}
.lang button.on{background:var(--acc);color:var(--btn-txt)}
.lang button:not(.on):hover{color:var(--acc2)}
.theme-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;
color:var(--txt);cursor:pointer;font-size:.86rem;display:flex;align-items:center;justify-content:center;
transition:border-color .2s,box-shadow .2s}
.theme-btn:hover{border-color:var(--acc)}

/* ---- disclaimer banner ---- */
.disclaimer{background:rgba(146,73,26,.08);border-bottom:1px solid var(--line);
padding:9px 18px;text-align:center;font-size:.74rem;color:var(--dim);flex-shrink:0}
.disclaimer b{color:var(--acc2);font-weight:600}
body.dark .disclaimer{background:rgba(206,143,90,.08)}

main{flex:1;overflow-y:auto;padding:18px}
.wrap{max-width:820px;margin:0 auto}

.intro{margin-bottom:22px}
.intro h2{font-family:var(--disp);font-size:1.3rem;font-weight:800;margin-bottom:8px}
.intro p{color:var(--dim);font-size:.9rem;line-height:1.7}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 20px}
.chip{border:1px solid var(--line);border-radius:100px;padding:7px 14px;font-size:.8rem;
color:var(--dim);cursor:pointer;background:none;font-family:var(--body)}
.chip:hover{border-color:var(--acc);color:var(--acc2)}

.msg{margin-bottom:16px;display:flex;gap:10px}
.msg .who{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;color:var(--dim);
padding-top:8px;min-width:34px;text-transform:uppercase;flex-shrink:0}
.bub{flex:1;border-radius:12px;padding:13px 16px;font-size:.92rem}
.me .bub{background:var(--panel2);border:1px solid var(--line)}
.ai .bub{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--acc)}
.bub a{color:var(--acc2);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.bub a:active{opacity:.6}
.src{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
font-size:.74rem;color:var(--dim)}
.src a{color:var(--acc2);font-weight:600}

.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--acc);
margin-right:3px;animation:b 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}

.limitbox{border:1px solid var(--warn);border-radius:12px;padding:16px 18px;background:rgba(178,61,34,.08);
font-size:.88rem;color:var(--txt);margin-bottom:16px}
body.dark .limitbox{background:rgba(224,118,90,.08)}
.limitbox b{color:var(--warn);display:block;margin-bottom:4px;font-family:var(--disp)}
.limitbox a{color:var(--acc2)}

footer{border-top:1px solid var(--line);padding:12px 18px;background:var(--panel);flex-shrink:0}
.inrow{max-width:820px;margin:0 auto;display:flex;gap:9px}
#q{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
background:var(--panel2);color:var(--txt);font-size:.92rem;font-family:var(--body);resize:none;max-height:110px}
#q:focus{outline:none;border-color:var(--acc)}
#q:disabled{opacity:.5}
#send{padding:12px 22px;border:none;border-radius:10px;cursor:pointer;font-weight:700;
background:linear-gradient(135deg,var(--acc),var(--acc-deep));color:var(--btn-txt);font-size:.88rem;white-space:nowrap}
#send:disabled{opacity:.4;cursor:default}
.hint{max-width:820px;margin:8px auto 0;font-size:.68rem;color:var(--dim);text-align:center}
.hint a{color:var(--acc2)}

/* ---- powered-by strip ---- */
.poweredby{max-width:820px;margin:10px auto 0;display:flex;align-items:center;justify-content:center;
gap:8px;font-size:.68rem;color:var(--dim)}
.poweredby img{height:16px;width:auto;filter:var(--logo-filter);opacity:.85}
.poweredby a{color:var(--dim);text-decoration:none;font-weight:600}
.poweredby a:hover{color:var(--acc2)}

@media(max-width:640px){
  .nav-extra{display:none}
}
@media(max-width:560px){
  header h1{font-size:.82rem}
  .quota-pill{display:none}
  .intro h2{font-size:1.1rem}
  .back-link span.lbl{display:none}
}
</style>
</head>

<header>
  <a class="back-link" href="/" aria-label="Back to homepage">
    <span aria-hidden="true">←</span><span class="lbl" data-l="navBack"></span>
  </a>
  <a class="home" href="/">
    <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 2l8 4.6v9.9L12 21l-8-4.5V6.6z"/><path d="M12 2v19M4 6.6l8 4.5 8-4.5M4 15.5l8-4.4 8 4.4"/></svg></span>
    <h1>AAEL</h1>

  <span class="tag">AI Pro</span>

  <div class="switches">

  <a class="hbtn nav-extra" href="/#knowledge" data-l="navKb"></a>
  <a class="hbtn nav-extra" href="/#contact" data-l="navContact"></a>
</header>

<div class="disclaimer" data-l="disclaimer"></div>

<main id="main"><div class="wrap">
  <div class="intro" id="introBlock">
    <h2 data-l="introH2"></h2>
    <p data-l="introP"></p>
  </div>
  <div class="chips" id="chips"></div>
  <div id="log"></div>
</div></main>

<footer id="foot">
  <div class="inrow">
    <textarea id="q" rows="1"></textarea>
    <button id="send" onclick="send()" data-l="sendBtn"></button>
  </div>
  <div class="hint"><span data-l="hint"></span><a href="/#contact" data-l="hintLink"></a></div>
  <div class="poweredby">
    <img src="/logo-mark.png" alt="AAEL" width="16" height="18">
    <span data-l="poweredBy"></span>
  </div>
</footer>

let currentLang = 'en';

let lastQuota = null;

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function md(s){
  let out = esc(s)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const placeholders = [];
  out = out.replace(/<a [^>]*>.*?<\/a>/g, m => {
    placeholders.push(m);
    return '\u0000' + (placeholders.length - 1) + '\u0000';
  });
  out = out.replace(/(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\u0000(\d+)\u0000/g, (_, i) => placeholders[i]);
  return out.replace(/\n/g,'<br>');
}

/* ---------- 語言切換：套用去所有 data-l 靜態元素 + 動態內容 ---------- */
function applyStaticLang(){
  document.querySelectorAll('[data-l]').forEach(function(el){
    var key = el.dataset.l;
    if(!L[key]) return;
    el.innerHTML = L[key][currentLang];
  });
  document.getElementById('q').placeholder = L.placeholder[currentLang];
}
function setLang(l){
  currentLang = l;
  ['en','zh','cn'].forEach(function(k){
    var el = document.getElementById('btn-'+k);
    if(el) el.classList.toggle('on', k===l);
  });
  document.documentElement.lang = l==='cn' ? 'zh-Hans' : (l==='zh' ? 'zh-Hant' : 'en');
  applyStaticLang();
  renderChips();
  if(lastQuota) updateQuota(lastQuota);
  try{ localStorage.setItem('aae-lang', l); }catch(e){}
}

/* ---------- 主題（跟隨網站：預設淺色，記住訪客選擇） ---------- */
function applyTheme(t){
  document.body.classList.toggle('dark', t==='dark');
  document.getElementById('theme-btn').textContent = t==='dark' ? '☀' : '☾';
  document.documentElement.style.backgroundColor = t==='dark' ? '#0A0C11' : '#F7F5F0';
  document.body.style.backgroundColor = 'transparent';
  var meta = document.querySelector('meta[name="color-scheme"]');
  if(meta) meta.setAttribute('content', t==='dark' ? 'dark' : 'light');
}
function toggleTheme(){
  var next = document.body.classList.contains('dark') ? 'light' : 'dark';
  applyTheme(next);
  try{ localStorage.setItem('aae-theme', next); }catch(e){}
}

function renderChips(){
  var c=document.getElementById('chips'); c.innerHTML='';
  SAMPLES.forEach(function(s){
    var q = s[currentLang] || s.zh;
    var b=document.createElement('button'); b.className='chip'; b.textContent=q;
    b.onclick=function(){document.getElementById('q').value=q;send();};
    c.appendChild(b);
  });
}

function add(role,html){
  var d=document.createElement('div');
  d.className='msg '+(role==='user'?'me':'ai');
  var who = role==='user' ? L.who_user[currentLang] : L.who_ai[currentLang];
  d.innerHTML='<div class="who">'+who+'</div><div class="bub">'+html+'</div>';
  document.getElementById('log').appendChild(d);
  document.getElementById('main').scrollTop=1e9;
  return d;
}

function updateQuota(q){
  if(!q) return;
  lastQuota = q;
  var pill = document.getElementById('quotaPill');
  var left = Math.max(0, q.limit - q.used);
  var text = QUOTA_TEXT[currentLang]({left:left, limit:q.limit});
  pill.innerHTML = text.replace(String(left), '<b>'+left+'</b>');
}

function disableInput(){
  document.getElementById('q').disabled = true;
  document.getElementById('q').placeholder = L.disableMsg[currentLang];
  document.getElementById('send').disabled = true;
}

var dailyLimitHit = false;
async function send(){
  if(dailyLimitHit) return;
  var el=document.getElementById('q'); var q=el.value.trim(); if(!q) return;
  el.value=''; el.style.height='auto';
  document.getElementById('send').disabled=true;
  add('user',esc(q));
  hist.push({role:'user',content:q});
  var wait=add('assistant','<span class="dots"><span></span><span></span><span></span></span>');
  try{
    var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:hist})});
    var raw=await r.text();
    var d;
    try{ d=JSON.parse(raw); }
    catch(_){
      console.error('AAEL AI Pro: non-JSON response from /api/chat (status '+r.status+'):', raw.slice(0,300));
      wait.querySelector('.bub').innerHTML =
        '<span style="color:var(--warn)">'+esc(L.errClient[currentLang])+'</span>';
      hist.pop(); return;
    }
    if(r.status===429 && d.dailyLimitReached){
      wait.remove(); hist.pop();
      var box=document.createElement('div');
      box.className='limitbox';
      box.innerHTML='<b>'+esc(L.limitTitle[currentLang])+'</b>'
        + esc(L.limitBody[currentLang])
        + '<a href="mailto:aaelhk.info@gmail.com">aaelhk.info@gmail.com</a>';
      document.getElementById('log').appendChild(box);
      document.getElementById('main').scrollTop=1e9;
      dailyLimitHit = true;
      disableInput();
      return;
    }
    if(!r.ok){
      var msg = d.upstreamRateLimited ? L.errRateLimited[currentLang] : L.errGeneric[currentLang];
      wait.querySelector('.bub').innerHTML='<span style="color:var(--warn)">'+esc(msg)+'</span>';
      hist.pop(); return;
    }
    hist.push({role:'assistant',content:d.reply});
    updateQuota(d.quota);
    var replyText = currentLang==='cn' ? conv(d.reply) : d.reply;
    var src=(d.sources||[]).map(function(s){
      var title = currentLang==='cn' ? conv(s.title) : s.title;
      return '<a href="https://aael.online/'+s.slug+'.html" target="_blank" rel="noopener">'+esc(title)+'</a>';
    }).join('\u3000');
    var srcHtml = src ? '<div class="src">'+esc(L.srcPrefix[currentLang])+src+'</div>' : '';
    wait.querySelector('.bub').innerHTML=md(replyText)+srcHtml;
  }catch(e){
    wait.querySelector('.bub').innerHTML='<span style="color:var(--warn)">'+esc(L.errGeneric[currentLang])+'</span>';
    hist.pop();
  }finally{
    if(!dailyLimitHit){
      document.getElementById('send').disabled=false;
      document.getElementById('q').focus();
    }
    document.getElementById('main').scrollTop=1e9;
  }
}

var qEl=document.getElementById('q');
qEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
qEl.addEventListener('input',function(){qEl.style.height='auto';qEl.style.height=Math.min(qEl.scrollHeight,110)+'px';});

/* ---------- init：跟隨網站設定（記住語言／主題） ---------- */
(function init(){
  var savedTheme = null;
  try{ savedTheme = localStorage.getItem('aae-theme'); }catch(e){}
  applyTheme(savedTheme === 'dark' ? 'dark' : 'light');

  var savedLang = null;
  try{ savedLang = localStorage.getItem('aae-lang'); }catch(e){}
  setLang(savedLang || 'en');
})();
</script>
</body>
</html>
